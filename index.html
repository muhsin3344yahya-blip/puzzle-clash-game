<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6d42e8"><title>Puzzle Clash</title>
<style>
:root{--purple:#a855f7;--deep:#581c87;--pink:#ff4fa3;--yellow:#ffe45e;--mint:#55f2c2;--blue:#53c7ff;--orange:#ff9850}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:white;background:radial-gradient(ellipse at top,#9c6cff 0,#6235cf 38%,#28145c 100%);display:flex;justify-content:center;padding:14px 12px 24px;touch-action:manipulation}
.app{width:min(100%,470px)}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 15px}.logo{font-size:clamp(24px,6vw,34px);font-weight:1000;letter-spacing:-1.5px;line-height:1;text-shadow:0 3px 0 #402092}.logo span{color:var(--yellow)}.pill{background:#ffffff24;border:1px solid #ffffff40;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;letter-spacing:.4px}
.hero{text-align:center;margin-bottom:15px}.hero h1{font-size:19px;margin:0 0 4px}.hero p{font-size:12px;color:#e5d9ff;margin:0}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.stat{background:#ffffff19;border:1px solid #ffffff30;border-radius:16px;text-align:center;padding:10px 4px;box-shadow:inset 0 1px #ffffff15}.stat label{display:block;text-transform:uppercase;font-size:10px;letter-spacing:1px;color:#e3d6ff;font-weight:800}.stat strong{font-size:22px;line-height:1.3;font-weight:950}.timerbar{height:7px;background:#160a3b66;border-radius:9px;overflow:hidden;margin:-4px 1px 12px}.timerfill{height:100%;width:100%;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--pink));transition:width .25s linear}
.board-wrap{background:#1e1047b8;border:2px solid #ffffff35;border-radius:22px;padding:8px;box-shadow:0 14px 35px #160a3b55,inset 0 1px #ffffff20}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;touch-action:manipulation}.tile{border:0;aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,5.3vw,27px);font-weight:900;box-shadow:inset 0 -4px #00000017,inset 0 2px #ffffff55,0 2px 2px #160a3b30;transition:transform .12s,filter .12s;cursor:pointer;padding:0;min-width:0;-webkit-tap-highlight-color:transparent}.tile:active{transform:scale(.9)}.tile.selected{outline:3px solid white;outline-offset:1px;transform:scale(.91);filter:brightness(1.13)}.c0{background:linear-gradient(145deg,#ff85c2,var(--pink))}.c1{background:linear-gradient(145deg,#ffe987,var(--yellow))}.c2{background:linear-gradient(145deg,#8ed0ff,var(--blue))}.c3{background:linear-gradient(145deg,#83f5d8,var(--mint))}.c4{background:linear-gradient(145deg,#c5a2ff,#9365f5)}.c5{background:linear-gradient(145deg,#ffc08c,var(--orange))}.hint{text-align:center;font-size:12px;color:#e6dcff;margin:11px 0 13px;min-height:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:15px;padding:13px 10px;font-size:14px;font-weight:900;cursor:pointer;color:var(--deep);background:white;box-shadow:0 4px 0 #c7b6f2}.btn.primary{background:var(--yellow);box-shadow:0 4px 0 #c28a22}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c7b6f2}.foot{text-align:center;font-size:10px;color:#cbb9ff;margin-top:15px}.overlay{position:fixed;inset:0;background:#160a3bcc;display:none;align-items:center;justify-content:center;padding:22px;z-index:3}.modal{width:min(100%,350px);background:linear-gradient(155deg,#8c60f5,#4b28a8);border:1px solid #ffffff66;border-radius:25px;padding:25px;text-align:center;box-shadow:0 20px 70px #12072d99}.modal h2{font-size:30px;margin:0 0 6px}.modal p{color:#eee4ff;margin:0 0 20px}.modal .btn{width:100%}
@media(max-width:360px){.board{gap:3px}.board-wrap{padding:6px}.tile{border-radius:8px}.stats{gap:5px}.stat strong{font-size:19px}}.tile {
  border-radius: 12px !important;
  box-shadow: inset 0 3px 0 rgba(255,255,255,.55),
              0 3px 0 rgba(0,0,0,.16),
              0 5px 10px rgba(0,0,0,.12) !important;
  transition: transform .16s ease, filter .16s ease;
}
.tile:hover {
  filter: brightness(1.12);
  transform: scale(1.04);
}
</style></head><body><main class="app">
<header class="top"><div class="logo">PUZZLE <span>CLASH</span></div><div class="pill">✨ BETA 01</div></header>
<section class="hero"><h1>Match. Score. Repeat!</h1><p>Swap neighboring tiles to match 3 or more.</p></section>
<section class="stats"><div class="stat"><label>Score</label><strong id="score">0</strong></div><div class="stat"><label>Best</label><strong id="best">0</strong></div><div class="stat"><label>Time left</label><strong id="time">60</strong></div></section>
<div class="timerbar"><div id="timerfill" class="timerfill"></div></div>
<div class="board-wrap"><div id="board" class="board" aria-label="Puzzle board"></div></div>
<div id="hint" class="hint">Tap a tile, then tap a neighbor to swap.</div>
<div class="actions"><button class="btn primary" id="restart">↻ Restart game</button><button class="btn" id="challenge">⚡ Challenge mode</button></div>
<div class="foot">PUZZLE CLASH • FIRST PLAYABLE PROTOTYPE</div>
</main>
<div id="overlay" class="overlay"><div class="modal"><h2 id="endtitle">Time's up!</h2><p id="endmsg">Nice puzzle solving!</p><button class="btn primary" id="playagain">Play again</button></div></div>
<script>
(()=>{
const N=8, TYPES=6, ICONS=['♥','★','●','◆','✦','⬟'];
let cells=[],selected=-1,score=0,time=60,playing=true,interval=null,best=0,challenge=false,busy=false;
const $=id=>document.getElementById(id),board=$('board');
try{best=Number(localStorage.getItem('pc_best')||0)}catch(e){} $('best').textContent=best;
function rand(){return Math.floor(Math.random()*TYPES)}
function createsMatch(a,i){let x=i%N,y=Math.floor(i/N),v=a[i];return (x>=2&&a[i-1]===v&&a[i-2]===v)||(y>=2&&a[i-N]===v&&a[i-2*N]===v)}
function newBoard(){cells=[];for(let i=0;i<N*N;i++){let v=rand(),tries=0;while(createsMatch([...cells,v],i)&&tries++<20)v=rand();cells.push(v)}render()}
function render(){board.innerHTML='';cells.forEach((v,i)=>{let b=document.createElement('button');b.className='tile c'+v+(selected===i?' selected':'');b.textContent=ICONS[v];b.setAttribute('aria-label','Tile '+(i+1));b.onclick=()=>tap(i);board.appendChild(b)})}
function say(s){$('hint').textContent=s}
function tap(i){if(!playing||busy)return;if(selected<0){selected=i;render();say('Now choose a neighboring tile.');return}if(selected===i){selected=-1;render();say('Choose a tile to begin.');return}let a=selected,b=i;if(Math.abs(a-b)!==N&&!(Math.floor(a/N)===Math.floor(b/N)&&Math.abs(a-b)===1)){selected=i;render();say('Choose a tile directly next to it.');return}selected=-1;swap(a,b);let m=findMatches();if(!m.size){swap(a,b);render();say('No match there — try another swap!');return}busy=true;clearMatches(m)}
function swap(a,b){let t=cells[a];cells[a]=cells[b];cells[b]=t}
function findMatches(){let set=new Set();for(let y=0;y<N;y++)for(let x=0;x<N;x++){let i=y*N+x,v=cells[i];if(x<=N-3&&cells[i+1]===v&&cells[i+2]===v){let k=x;while(k<N&&cells[y*N+k]===v)set.add(y*N+k),k++}if(y<=N-3&&cells[i+N]===v&&cells[i+2*N]===v){let k=y;while(k<N&&cells[k*N+x]===v)set.add(k*N+x),k++}}return set}
function updateStats(){$('score').textContent=score;$('time').textContent=time;$('timerfill').style.width=(time/60*100)+'%';if(score>best){best=score;$('best').textContent=best;try{localStorage.setItem('pc_best',best)}catch(e){}}}
function clearMatches(set){if(!set.size){busy=false;return}score+=set.size*10+(set.size>=5?50:0);set.forEach(i=>cells[i]=-1);updateStats();render();setTimeout(()=>{for(let x=0;x<N;x++){let vals=[];for(let y=N-1;y>=0;y--)if(cells[y*N+x]!==-1)vals.push(cells[y*N+x]);while(vals.length<N)vals.push(rand());for(let y=N-1,j=0;y>=0;y--,j++)cells[y*N+x]=vals[j]}render();let next=findMatches();if(next.size)setTimeout(()=>clearMatches(next),180);else{busy=false;say('Great match! Keep going for a combo.')}},180)}
function start(){clearInterval(interval);score=0;time=60;playing=true;busy=false;selected=-1;$('overlay').style.display='none';updateStats();newBoard();say(challenge?'Challenge mode: score as much as you can!':'Tap a tile, then tap a neighbor to swap.');interval=setInterval(()=>{if(!playing)return;time--;updateStats();if(time<=0)end()},1000)}
function end(){playing=false;clearInterval(interval);$('endtitle').textContent='Time’s up!';$('endmsg').textContent='You scored '+score+' points. '+(score>=500?'Amazing matching!':'Play again and beat your best!');$('overlay').style.display='flex';say('Round complete — try again to beat your best.')}
$('restart').onclick=()=>start();$('playagain').onclick=()=>start();$('challenge').onclick=()=>{challenge=!challenge;$('challenge').textContent=challenge?'⚡ Classic mode':'⚡ Challenge mode';start()};start();
})();
</script></body></html>
